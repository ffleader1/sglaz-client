[package]
name = "sglaz"
version = "0.1.4"
edition = "2024"
description = "sglaz client agent — syncs environment variables with the sglaz server"

[[bin]]
name = "sglaz"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
directories = "5"
gethostname = "0.5"
anyhow = "1"
# Archive ("folder"/Python release) extraction: GitHub source tarballs are .tar.gz.
flate2 = "1"
tar = "0.4"

# Windows-only: system-tray UI + a hidden log console. The daemon runs headless
# in the tray; the console is shown/hidden on demand and never kills the process.
[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
opt-level = "z"
lto = true
